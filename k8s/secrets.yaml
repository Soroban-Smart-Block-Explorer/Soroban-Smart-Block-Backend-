---
# Secret — sensitive environment values for the Soroban Explorer.
# Values are base64-encoded. Use `echo -n 'value' | base64` to encode.
# In production, manage secrets via external-secrets-operator, Vault, or AWS Secrets Manager
# rather than committing real values here.
#
# IMPORTANT: Do NOT commit real secrets to source control.
#            This file contains placeholder (example) values only.
apiVersion: v1
kind: Secret
metadata:
  name: soroban-explorer-secrets
  namespace: soroban
  labels:
    app.kubernetes.io/name: soroban-explorer
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # PostgreSQL connection strings, one per network profile (see src/profiles.ts).
  # Format: postgresql://user:password@host:5432/dbname
  TESTNET_DATABASE_URL: "postgresql://soroban:REPLACE_PASSWORD@postgres-testnet:5432/soroban_testnet"
  TESTNET_READ_REPLICA_URL: "postgresql://soroban:REPLACE_PASSWORD@postgres-testnet-read:5432/soroban_testnet"
  MAINNET_DATABASE_URL: "postgresql://soroban:REPLACE_PASSWORD@postgres-mainnet:5432/soroban_mainnet"
  MAINNET_READ_REPLICA_URL: "postgresql://soroban:REPLACE_PASSWORD@postgres-mainnet-read:5432/soroban_mainnet"

  # Redis connection URL (per network — profiles.ts reads TESTNET_CACHE_URL / MAINNET_CACHE_URL)
  TESTNET_CACHE_URL: "redis://:REPLACE_PASSWORD@redis:6379"
  MAINNET_CACHE_URL: "redis://:REPLACE_PASSWORD@redis:6379"

  # Internal API key for service-to-service calls (generate a strong random value)
  INTERNAL_API_KEY: "REPLACE_WITH_STRONG_RANDOM_KEY"

  # JWT secret for auth tokens
  JWT_SECRET: "REPLACE_WITH_STRONG_JWT_SECRET"

  # Stripe billing (optional — set if ENABLE_BILLING=true)
  STRIPE_SECRET_KEY: "sk_live_REPLACE"
  STRIPE_WEBHOOK_SECRET: "whsec_REPLACE"
