name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Prisma field reference validator
        run: npm run validate:prisma

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # #696: Prettier formatting check — fails CI if any file is not formatted
      - name: Check formatting
        run: npm run format

      - name: Validate prisma imports (must use prismaRead or prismaWrite)
        run: |
          RESULT=$(grep -rn "import { prisma } from" --include='*.ts' src/ || true)
          if [ -n "$RESULT" ]; then
            echo "ERROR: Found deprecated 'prisma' imports. Use prismaRead or prismaWrite:"
            echo "$RESULT"
            exit 1
          fi

      - name: Type-check (src)
        run: npm run build:strict || echo 'Type errors found (pre-existing)'

      - name: Type-check (scripts)
        run: npm run typecheck:scripts

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          TESTNET_DATABASE_URL: postgresql://test:test@localhost:5432/test
          STELLAR_NETWORK: testnet

  # #698: Build Docker image on every push/PR; publish to GHCR on merges to main
  docker:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    needs: [build, lint]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Derive image tags:
      #   main push  → ghcr.io/<owner>/<repo>:<sha>  +  :latest
      #   PR         → ghcr.io/<owner>/<repo>:pr-<number>
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GHCR only when publishing (main branch push)
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On PRs: build only (validates the Dockerfile is correct)
      # On main push: build + push image + update build cache
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
