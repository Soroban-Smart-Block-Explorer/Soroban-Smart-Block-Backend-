name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Prisma generate
        uses: actions/cache@v4
        with:
          path: node_modules/.prisma
          key: prisma-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: prisma-

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Prisma field reference validator
        run: npm run validate:prisma

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Prisma generate
        uses: actions/cache@v4
        with:
          path: node_modules/.prisma
          key: prisma-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: prisma-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # #696: Prettier formatting check — fails CI if any file is not formatted
      - name: Check formatting
        run: npm run format

      - name: Validate prisma imports (must use prismaRead or prismaWrite)
        run: |
          RESULT=$(grep -rn "import { prisma } from" --include='*.ts' src/ || true)
          if [ -n "$RESULT" ]; then
            echo "ERROR: Found deprecated 'prisma' imports. Use prismaRead or prismaWrite:"
            echo "$RESULT"
            exit 1
          fi

      - name: Type-check (src)
        run: npm run build:strict || echo 'Type errors found (pre-existing)'

      - name: Type-check (scripts)
        run: npm run typecheck:scripts

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Prisma generate
        uses: actions/cache@v4
        with:
          path: node_modules/.prisma
          key: prisma-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: prisma-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          TESTNET_DATABASE_URL: postgresql://test:test@localhost:5432/test
          STELLAR_NETWORK: testnet

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  deploy:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: [build, lint, test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.TESTNET_DATABASE_URL }}

      - name: Build application
        run: npm run build

      - name: Deploy to testnet
        run: |
          echo "Deploying to testnet..."
          # Placeholder: replace with actual deployment command
          # e.g. docker push, kubectl apply, serverless deploy, etc.
          echo "Deployment placeholder executed"
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
