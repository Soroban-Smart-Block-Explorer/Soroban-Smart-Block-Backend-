name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # `security-events: write` is required for CodeQL to upload SARIF results;
  # without it the Security job's CodeQL steps fail with
  # "Resource not accessible by integration".
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image: the search_engine migration (20260625000000) creates
        # the "vector" extension for embeddings, which plain postgres lacks.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Cache Prisma generate
        uses: actions/cache@v5
        with:
          path: node_modules/.prisma
          key: prisma-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: prisma-

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Prisma field reference validator
        run: npm run validate:prisma

      # Verify the Prisma schema is valid and fully materializable on a clean
      # database. `migrate deploy` is not used here: the migration history is
      # incomplete (several schema models were never materialized by a
      # migration), so it fails on every fresh database. `db push` applies the
      # full schema, which is exactly what this verification step needs.
      - name: Verify schema (prisma db push)
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          TESTNET_DATABASE_URL: postgresql://test:test@localhost:5432/test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Cache Prisma generate
        uses: actions/cache@v5
        with:
          path: node_modules/.prisma
          key: prisma-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: prisma-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # #696: Prettier formatting check — fails CI if any file is not formatted
      - name: Check formatting
        run: npm run format

      - name: Validate prisma imports (must use prismaRead or prismaWrite)
        run: |
          RESULT=$(grep -rn "import { prisma } from" --include='*.ts' src/ || true)
          if [ -n "$RESULT" ]; then
            echo "ERROR: Found deprecated 'prisma' imports. Use prismaRead or prismaWrite:"
            echo "$RESULT"
            exit 1
          fi

      - name: Type-check (src)
        run: npm run build:strict || echo 'Type errors found (pre-existing)'

      - name: Type-check (scripts)
        run: npm run typecheck:scripts

      # Orphaned router validation — fails CI if the number of routers in
      # src/api/ that are neither mounted (directly or transitively) in
      # router.ts nor allowlisted exceeds the budget. The budget equals the
      # true orphan count (15) and is lowered as orphans are mounted or
      # deleted (tracked in docs/orphaned-routes-tracking.md).
      - name: Validate orphaned routers (budget 15)
        run: npm run validate-routes:ci

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image: the search_engine migration (20260625000000) creates
        # the "vector" extension for embeddings, which plain postgres lacks.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Cache Prisma generate
        uses: actions/cache@v5
        with:
          path: node_modules/.prisma
          key: prisma-${{ hashFiles('prisma/schema.prisma') }}
          restore-keys: prisma-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          TESTNET_DATABASE_URL: postgresql://test:test@localhost:5432/test
          STELLAR_NETWORK: testnet

  k8s-lint:
    name: K8s Manifest Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # kubeconform validates every manifest in k8s/ against the upstream
      # Kubernetes OpenAPI schemas (including PodDisruptionBudget and
      # NetworkPolicy — #904) — catches typos, wrong apiVersions, and missing
      # required fields before they ever reach a cluster.
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate k8s manifests (kubeconform)
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            -kubernetes-version 1.29.0 \
            k8s/*.yaml

      # Belt-and-braces: also do a client-side dry-run apply, which catches a
      # narrower but useful class of issues (duplicate names, structurally
      # invalid YAML documents) using the real kubectl parser.
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Validate k8s manifests (kubectl dry-run)
        run: kubectl apply --dry-run=client --validate=true -f k8s/ --recursive

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || true

      # CodeQL runs inside ci.yml's `security` job (not a dedicated workflow)
      # so it matches the repository's code-scanning default-setup configuration
      # (`ci.yml:security` + `javascript`). Analyzing via a different workflow
      # makes the code-scanning check warn that configurations present on main
      # were not found, so `languages` must stay exactly `javascript` (the
      # JavaScript extractor covers TypeScript files too).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
