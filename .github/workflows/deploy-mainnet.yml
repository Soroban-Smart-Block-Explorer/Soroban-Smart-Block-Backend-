name: Manual Deploy to Mainnet

on:
  workflow_dispatch:
    inputs:
      confirm_mainnet:
        description: 'Type "deploy-to-mainnet" to confirm'
        required: true
        default: ''

jobs:
  deploy:
    name: Deploy to Mainnet
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm_mainnet == 'deploy-to-mainnet' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.MAINNET_DATABASE_URL }}

      - name: Build application
        run: npm run build

      - name: Deploy to mainnet
        run: |
          echo "Deploying to mainnet..."
          # Placeholder: replace with actual deployment command
          # e.g. docker push, kubectl apply, serverless deploy, etc.
          echo "Mainnet deployment placeholder executed"
        env:
          DEPLOY_SECRET: ${{ secrets.MAINNET_DEPLOY_SECRET }}
