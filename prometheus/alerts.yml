# prometheus/alerts.yml
#
# Prometheus alerting rules for the Soroban Smart Block Explorer backend.
#
# Issues:
#   #908 — Prometheus alert rules for HTTP 5xx surge, indexer lag, DB status, replica lag
#   #909 — Redis cache fallback alert
#
# Validate with: promtool check rules prometheus/alerts.yml
# CI step: .github/workflows/ci.yml → prometheus-lint job

groups:
  - name: soroban_explorer_api
    interval: 30s
    rules:
      # ── HTTP 5xx Surge ───────────────────────────────────────────────────────
      # Fires when the rolling 5xx ratio reported by the metrics middleware
      # exceeds the 1% threshold. This gauge is updated by src/middleware/
      # metricsMiddleware.ts and exposed at GET /metrics.
      - alert: HTTP5xxSurgeRatio
        expr: http_5xx_surge_ratio > 0.01
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.instance }}"
          description: >
            The HTTP 5xx surge ratio is {{ $value | humanizePercentage }} (threshold: 1%).
            This means more than 1% of requests are returning 5xx responses over
            the last 5-minute window. Check application logs and recent deployments.
          runbook_url: "https://github.com/Soroban-Smart-Block-Explorer/runbooks/blob/main/http-5xx-surge.md"

      # ── Indexer Ingestion Lag ────────────────────────────────────────────────
      # Warns when the indexer falls more than 50 ledgers behind the chain tip
      # (degraded SLA), and pages at 200 ledgers (severe lag — roughly 16 min).
      - alert: IndexerIngestionLagWarning
        expr: indexer_ingestion_lag_ledgers > 50
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Indexer lagging behind chain tip on {{ $labels.instance }}"
          description: >
            The indexer is {{ $value }} ledgers behind the chain tip (warning threshold: 50).
            At ~5 second block times this is {{ $value | humanizeDuration }} of lag.
            Check indexer logs and RPC connectivity.
          runbook_url: "https://github.com/Soroban-Smart-Block-Explorer/runbooks/blob/main/indexer-lag.md"

      - alert: IndexerIngestionLagCritical
        expr: indexer_ingestion_lag_ledgers > 200
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Critical indexer lag on {{ $labels.instance }}"
          description: >
            The indexer is {{ $value }} ledgers behind the chain tip (critical threshold: 200).
            This indicates the indexer may be stalled. Immediate investigation required.
          runbook_url: "https://github.com/Soroban-Smart-Block-Explorer/runbooks/blob/main/indexer-lag.md"

  - name: soroban_explorer_database
    interval: 30s
    rules:
      # ── Database Connection Down ─────────────────────────────────────────────
      # Fires when the db_connection_status gauge drops to 0.
      # This gauge is set to 1 on successful startup and 0 on graceful shutdown
      # or connection failure (src/index.ts, src/health.ts).
      - alert: DatabaseConnectionDown
        expr: db_connection_status == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Database connection is down on {{ $labels.instance }}"
          description: >
            The database connection status metric is 0, indicating the primary
            PostgreSQL connection is unavailable. The API cannot serve read or
            write requests. Check DATABASE_URL, pg connection pool, and RDS/pg health.
          runbook_url: "https://github.com/Soroban-Smart-Block-Explorer/runbooks/blob/main/database-down.md"

      # ── Replica Lag Check Errors ─────────────────────────────────────────────
      # Fires when the replica lag checker encounters repeated errors, which
      # causes the application to fall back to the primary for all reads
      # (increased primary load, reduced read scalability).
      - alert: ReplicaLagCheckErrors
        expr: increase(replica_lag_check_errors_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Replica lag check errors on {{ $labels.instance }}"
          description: >
            {{ $value }} replica lag-check error(s) in the last 5 minutes.
            The application is falling back to the primary database for reads,
            increasing load on the write primary. Check read replica connectivity
            and TESTNET_DATABASE_URL configuration.
          runbook_url: "https://github.com/Soroban-Smart-Block-Explorer/runbooks/blob/main/replica-lag.md"

  - name: soroban_explorer_cache
    interval: 30s
    rules:
      # ── Redis Cache Fallback (Issue #909) ────────────────────────────────────
      # Fires when the cache backend falls back to the in-memory store because
      # Redis is unavailable. In-memory cache is not shared across replicas and
      # does not survive restarts, causing increased DB load and cache misses.
      #
      # This gauge is set by src/cache.ts:
      #   1 = Redis (or Sentinel) connected and healthy
      #   0 = Fallback to in-memory store (Redis unavailable or not configured
      #       when REDIS_ENABLED=true / CACHE_URL is a redis:// URL)
      - alert: CacheBackendFallback
        expr: cache_backend_status == 0
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Cache has fallen back to in-memory on {{ $labels.instance }}"
          description: >
            The cache_backend_status metric is 0, meaning the application is
            operating in in-memory fallback mode. Redis is either unavailable or
            could not be reached. Rate limiting and caching are degraded: cache
            entries are not shared across API replicas and will not survive restarts.
            Check REDIS_URL / CACHE_URL, Redis service health, and network connectivity.
          runbook_url: "https://github.com/Soroban-Smart-Block-Explorer/runbooks/blob/main/redis-fallback.md"

      # ── Redis Sustained Fallback (escalation) ───────────────────────────────
      # Escalates to critical if Redis has been unavailable for more than 15 min.
      - alert: CacheBackendFallbackCritical
        expr: cache_backend_status == 0
        for: 15m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Redis has been unavailable for >15 min on {{ $labels.instance }}"
          description: >
            Redis has been unreachable for over 15 minutes. The in-memory fallback
            does not persist data across restarts or share state between replicas.
            Rate limiting is operating per-instance. Immediate action required.
          runbook_url: "https://github.com/Soroban-Smart-Block-Explorer/runbooks/blob/main/redis-fallback.md"

  # ── GraphQL subscriptions (DX03) ───────────────────────────────────────────
  # SLOs and error budgets: docs/graphql-subscriptions/design.md §SLOs.
  # Runbook: docs/graphql-subscriptions/runbook.md.
  #   SLO-1 admission availability: ≥ 99.5% of well-formed subscription
  #         requests are admitted (capacity rejections burn the budget;
  #         per-client limit and invalid-argument rejections do not).
  #   SLO-2 bridge integrity: ≤ 0.1% of bridged messages hit handler_error.
  #   SLO-3 bridge latency: p99 < 5 ms.
  - name: soroban_explorer_graphql_subscriptions
    interval: 30s
    rules:
      - record: graphql_subscriptions:admission_error_ratio:rate1h
        expr: |
          sum(rate(graphql_subscription_admissions_total{outcome="rejected_capacity"}[1h]))
          /
          clamp_min(sum(rate(graphql_subscription_admissions_total{outcome=~"accepted|rejected_capacity"}[1h])), 1e-9)

      - record: graphql_subscriptions:admission_error_ratio:rate6h
        expr: |
          sum(rate(graphql_subscription_admissions_total{outcome="rejected_capacity"}[6h]))
          /
          clamp_min(sum(rate(graphql_subscription_admissions_total{outcome=~"accepted|rejected_capacity"}[6h])), 1e-9)

      # Multi-window burn-rate alerts against the 0.5% error budget (SLO-1).
      - alert: GraphQLSubscriptionAdmissionBudgetFastBurn
        expr: graphql_subscriptions:admission_error_ratio:rate1h > (14.4 * 0.005)
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "GraphQL subscription capacity rejections burning error budget fast"
          description: >
            {{ $value | humanizePercentage }} of subscription admissions were rejected for
            capacity over 1h (budget 0.5%, burn rate > 14.4x). Scale out or raise
            GQL_SUBSCRIPTION_MAX_GLOBAL; see the runbook.
          runbook_url: "https://github.com/Soroban-Smart-Block-Explorer/Soroban-Smart-Block-Backend-/blob/main/docs/graphql-subscriptions/runbook.md#capacity-exhausted"

      - alert: GraphQLSubscriptionAdmissionBudgetSlowBurn
        expr: graphql_subscriptions:admission_error_ratio:rate6h > (6 * 0.005)
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "GraphQL subscription capacity rejections burning error budget"
          description: >
            {{ $value | humanizePercentage }} of subscription admissions were rejected for
            capacity over 6h (budget 0.5%, burn rate > 6x).
          runbook_url: "https://github.com/Soroban-Smart-Block-Explorer/Soroban-Smart-Block-Backend-/blob/main/docs/graphql-subscriptions/runbook.md#capacity-exhausted"

      - alert: GraphQLSubscriptionBridgeErrors
        expr: |
          sum(rate(graphql_subscription_bridge_dropped_total{reason="handler_error"}[15m]))
          /
          clamp_min(sum(rate(graphql_subscription_messages_total[15m])), 1e-9) > 0.001
        for: 10m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "GraphQL subscription bridge failing to publish (SLO-2)"
          description: >
            More than 0.1% of feed messages failed inside the GraphQL bridge over 15m.
          runbook_url: "https://github.com/Soroban-Smart-Block-Explorer/Soroban-Smart-Block-Backend-/blob/main/docs/graphql-subscriptions/runbook.md#bridge-errors"

      - alert: GraphQLSubscriptionInvalidFeedPayloads
        expr: sum(rate(graphql_subscription_bridge_dropped_total{reason=~"invalid_payload|malformed_envelope"}[15m])) > 0.1
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Feed bus is emitting payloads the GraphQL bridge rejects"
          description: >
            {{ $value }} msg/s dropped as invalid — upstream data corruption or a feed
            schema change. Subscribers are protected; investigate the publisher.
          runbook_url: "https://github.com/Soroban-Smart-Block-Explorer/Soroban-Smart-Block-Backend-/blob/main/docs/graphql-subscriptions/runbook.md#invalid-payloads"

      - alert: GraphQLSubscriptionBridgeLatencyHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(graphql_subscription_bridge_duration_seconds_bucket[10m]))) > 0.005
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "GraphQL subscription bridge p99 above 5ms (SLO-3)"
          description: "Bridge p99 is {{ $value | humanizeDuration }}."
          runbook_url: "https://github.com/Soroban-Smart-Block-Explorer/Soroban-Smart-Block-Backend-/blob/main/docs/graphql-subscriptions/runbook.md#latency"

  # ── Try-it API console (DX04) ──────────────────────────────────────────────
  # SLOs: docs/try-it/design.md §SLOs · Runbook: docs/try-it/runbook.md
  #   SLO-1 catalog availability: ≥ 99.9% of catalog responses are not 503 (30d).
  #   SLO-2 console requests: ≤ 1% of API requests sent from the console are 5xx.
  #   SLO-3 catalog build p99 < 1 s.
  - name: soroban_explorer_tryit
    interval: 30s
    rules:
      - record: tryit:catalog_error_ratio:rate1h
        expr: |
          sum(rate(tryit_asset_requests_total{asset="catalog",status="503"}[1h]))
          /
          clamp_min(sum(rate(tryit_asset_requests_total{asset="catalog"}[1h])), 1e-9)

      - alert: TryItCatalogUnavailable
        expr: tryit:catalog_error_ratio:rate1h > (14.4 * 0.001)
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Try-it console catalog failing to build (SLO-1 fast burn)"
          description: >
            {{ $value | humanizePercentage }} of catalog requests returned 503 over 1h
            (budget 0.1%). The console shows a fallback link to the raw spec.
          runbook_url: "https://github.com/Soroban-Smart-Block-Explorer/Soroban-Smart-Block-Backend-/blob/main/docs/try-it/runbook.md#catalog-unavailable"

      - alert: TryItConsoleRequests5xx
        expr: |
          sum(rate(tryit_api_requests_total{status_class="5xx"}[15m]))
          /
          clamp_min(sum(rate(tryit_api_requests_total[15m])), 1e-9) > 0.01
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Requests sent from the try-it console are failing (SLO-2)"
          description: >
            {{ $value | humanizePercentage }} of console-originated API requests returned 5xx.
            Usually mirrors an API incident; check HTTP5xxSurgeRatio first.
          runbook_url: "https://github.com/Soroban-Smart-Block-Explorer/Soroban-Smart-Block-Backend-/blob/main/docs/try-it/runbook.md#console-requests-failing"
